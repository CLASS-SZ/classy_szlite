name: publish to PyPI

# Triggered by pushing a version tag like v0.2.0
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build distributions
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing — see https://docs.pypi.org/trusted-publishers/
    # For this to work, configure the project on PyPI to trust this repo
    # (CLASS-SZ/classy_szlite) + workflow (publish.yml) + environment.
    environment:
      name: pypi
      url: https://pypi.org/p/classy_szlite
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
