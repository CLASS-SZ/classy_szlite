name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import smoke test (no emulator data on CI)
        run: |
          python -c "import classy_szlite; print(classy_szlite.__version__)"
          python -c "from classy_szlite import CosmoParams, ProfileParamsA10; print(CosmoParams())"
      - name: Run pytest (smoke tests are skipped when data is absent)
        run: pytest -v
