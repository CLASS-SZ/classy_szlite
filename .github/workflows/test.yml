name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
      - name: Import smoke test (no emulator data on CI)
        run: |
          python -c "import classy_szlite; print(classy_szlite.__version__)"
          python -c "from classy_szlite import CosmoParams, ProfileParamsA10; print(CosmoParams())"
      - name: Run pytest with coverage (data-dependent tests skipped on CI)
        run: |
          pytest -v --cov=classy_szlite --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
