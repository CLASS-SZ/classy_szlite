[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name            = "classy_szlite"
version         = "0.2.12"
description     = "Fast, differentiable cosmology in pure JAX. CMB Cls, matter Pk (linear and nonlinear), distances, derived parameters, and halo-model tSZ Cl^yy via high-accuracy ede-v2 CosmoPower emulators."
readme          = "README.md"
license         = {text = "MIT"}
requires-python = ">=3.10"
authors         = [{name = "Boris Bolliet", email = "boris.bolliet@gmail.com"}]
keywords        = ["cosmology", "cmb", "tsz", "halo-model", "jax", "ede"]
classifiers     = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "jax>=0.4",
    "numpy>=1.24",
    "mcfit>=0.0.21",
]

[project.optional-dependencies]
dev    = ["pytest>=7", "pytest-xdist", "pytest-cov"]
plots  = ["matplotlib>=3.6"]

[project.scripts]
classy-szlite-get-data = "classy_szlite.fetch_data:main"

[project.urls]
Homepage = "https://github.com/CLASS-SZ/classy_szlite"
Source   = "https://github.com/CLASS-SZ/classy_szlite"

[tool.setuptools.packages.find]
where    = ["."]
include  = ["classy_szlite*"]
exclude  = ["tests*", "examples*"]

[tool.coverage.run]
source = ["classy_szlite"]
# The cobaya extractors and their CLI need a full cobaya + act_dr6_mflike
# install + Planck/ACT data packages to exercise. They are pure scripts
# (run once per machine to produce the npz tables), so we leave them out of
# the coverage metric — the JAX likelihoods themselves are covered by
# tests/test_likelihoods.py when the data is present.
omit = [
    "classy_szlite/likelihoods/_extract_main.py",
    "classy_szlite/likelihoods/_extract_fg.py",
    "classy_szlite/likelihoods/extract_data.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
