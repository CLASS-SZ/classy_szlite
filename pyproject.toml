[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name            = "classy_szlite"
version         = "0.2.0"
description     = "Fast, differentiable cosmology in pure JAX. CMB Cls, matter Pk (linear and nonlinear), distances, derived parameters, and halo-model tSZ Cl^yy via high-accuracy ede-v2 CosmoPower emulators."
readme          = "README.md"
license         = {text = "MIT"}
requires-python = ">=3.10"
authors         = [{name = "Boris Bolliet", email = "boris.bolliet@gmail.com"}]
keywords        = ["cosmology", "cmb", "tsz", "halo-model", "jax", "ede"]
classifiers     = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "jax>=0.4",
    "numpy>=1.24",
    "mcfit>=0.0.21",
]

[project.optional-dependencies]
dev    = ["pytest>=7", "pytest-xdist"]
plots  = ["matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/CLASS-SZ/classy_szlite"
Source   = "https://github.com/CLASS-SZ/classy_szlite"

[tool.setuptools.packages.find]
where    = ["."]
include  = ["classy_szlite*"]
exclude  = ["tests*", "examples*"]
